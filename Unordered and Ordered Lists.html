    <h1 style="text-align: center;">Unordered and Ordered Lists</h1>
    <hr>
    <h2>What's the Difference Between the Two?</h2>
    <h3>
        <ul>
        <li>Unordered Lists are items listed with bullet points and they are not ordered</li>
        <li>Ordered Lists are items listed with a specific order (eg. numbers, letters, Roman numerals)</li>
    </ul>
    </h3>
